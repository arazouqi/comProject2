<!DOCTYPE html>
<html>
<head>
    <title>Student — ClassIn</title>
    <script src="calendar.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
    <span class="navbar-brand">ClassIn</span>
    <div class="navbar-right" id="navRight">
        <span style="font-size:13px;color:var(--text-muted);font-weight:500;">Student Portal</span>
        <button onclick="logout()" class="danger-btn">Logout</button>
    </div>
</nav>

<!-- Main dashboard view -->
<div id="main" class="page-wrapper">
    <div class="page-header">
        <h1>My Dashboard</h1>
        <div style="display:flex;gap:10px;">
            <button onclick="openCalendar()" class="primary-btn">Calendar</button>
            <button onclick="openAttendance()" class="secondary-btn">Attendance</button>
        </div>
    </div>

    <div class="dashboard-cards">
        <div class="info-card">
            <h3>My Account</h3>
            <p style="color:var(--text-muted);font-size:13px;margin-bottom:4px;">Email</p>
            <p id="studentEmail" style="font-weight:600;word-break:break-all;"></p>
            <p style="color:var(--text-muted);font-size:13px;margin-bottom:4px;margin-top:12px;">Class Group</p>
            <p id="studentClass" style="font-weight:600;"></p>
        </div>

        <div class="info-card">
            <h3>Attendance</h3>
            <div class="stat-value" id="dashboardAttendance">—</div>
            <p style="color:var(--text-muted);font-size:13px;margin-top:8px;">
                <span id="dashboardAttended">0</span> events attended
            </p>
        </div>

        <div class="info-card">
            <h3>Upcoming Events</h3>
            <div id="upcomingEvents" style="display:flex;flex-direction:column;gap:0;"></div>
            <p id="noUpcoming" style="color:var(--text-muted);font-size:13px;display:none;">No upcoming events</p>
        </div>
    </div>
</div>

<!-- Calendar view -->
<div id="calendarDiv" style="display:none;" class="page-wrapper">
    <div class="page-header">
        <h1>My Calendar</h1>
        <button onclick="openDashboard()" class="secondary-btn">← Back</button>
    </div>
    <div id="calendar"></div>
</div>

<!-- Attendance view -->
<div id="attendanceDiv" style="display:none;" class="page-wrapper">
    <div class="page-header">
        <h1>My Attendance</h1>
        <button onclick="openDashboard()" class="secondary-btn">← Back</button>
    </div>

    <div class="attendance-summary-card">
        <div class="att-stat">
            <span class="att-stat-label">Rate</span>
            <span class="att-stat-value" id="attendancePercentage" style="color:var(--primary);">0%</span>
        </div>
        <div class="att-stat">
            <span class="att-stat-label">Counted</span>
            <span class="att-stat-value" id="countedEvents">0</span>
        </div>
        <div class="att-stat">
            <span class="att-stat-label">Attended</span>
            <span class="att-stat-value green" id="attendedEvents">0</span>
        </div>
        <div class="att-stat">
            <span class="att-stat-label">Missed</span>
            <span class="att-stat-value red" id="missedEvents">0</span>
        </div>
    </div>

    <p class="section-title">Breakdown</p>
    <div id="attendanceList"></div>
</div>

<!-- Event Detail Modal -->
<div id="eventModal" class="modal">
    <div class="modal-content">
        <h2 id="eventTitle"></h2>

        <div class="event-detail">
            <strong>Location</strong>
            <span id="eventLocation"></span>
        </div>
        <div class="event-detail">
            <strong>Class Group</strong>
            <span id="eventClass"></span>
        </div>
        <div class="event-detail">
            <strong>Start</strong>
            <span id="eventStart"></span>
        </div>
        <div class="event-detail">
            <strong>End</strong>
            <span id="eventEnd"></span>
        </div>

        <div class="modal-actions">
            <button id="qrBtn" class="primary-btn"></button>
            <button onclick="closeEventModal()" class="secondary-btn">Close</button>
        </div>
        <p id="checkinError" class="modal-error"></p>
    </div>
</div>

<script>
    let calendar
    let calendarInitialized = false
    let selectedEventId = null
    let email
    let classgroup

    function openEventModal(event) {
        selectedEventId = event.id

        document.getElementById("eventTitle").textContent = event.title
        document.getElementById("eventLocation").textContent = event.extendedProps.location
        document.getElementById("eventClass").textContent = event.extendedProps.classGroup
        document.getElementById("eventStart").textContent = new Date(event.start).toLocaleString()
        document.getElementById("eventEnd").textContent = new Date(event.end).toLocaleString()
        document.getElementById("checkinError").textContent = ""

        const qrBtn = document.getElementById("qrBtn")

        if (new Date() > new Date(event.end)) {
            qrBtn.textContent = "Attendance Closed"
            qrBtn.className = "secondary-btn"
            qrBtn.onclick = null
        } else if (event.extendedProps.attendees.includes(email)) {
            qrBtn.textContent = "✓ Checked In"
            qrBtn.className = "secondary-btn"
            qrBtn.onclick = null
        } else {
            qrBtn.textContent = "Check In"
            qrBtn.className = "primary-btn"
            qrBtn.onclick = () => checkIn(selectedEventId)
        }

        document.getElementById("eventModal").style.display = "flex"
    }

    function closeEventModal() {
        document.getElementById("eventModal").style.display = "none"
    }

    async function loadPage() {
        const loggedIn = await fetch("/api/auth/getloggedin")
        if (!loggedIn.ok) { window.location.href = "/signin.html"; return }
        const data = await loggedIn.json()
        email = data.email
        classgroup = data.classgroup

        await Promise.all([loadDashboard(), loadEvents()])
    }

    async function loadEvents() {
        const res = await fetch("/api/events/")
        const allEvents = await res.json()
        const filteredEvents = allEvents.filter(f => f.classGroup === classgroup)

        const formattedEvents = filteredEvents.map(e => ({
            id: e.id,
            title: e.name,
            start: e.startTime,
            end: e.endTime,
            extendedProps: {
                location: e.location,
                classGroup: e.classGroup,
                attendees: e.attendees
            }
        }))

        calendar = new ClassInCalendar("calendar", {
            events: formattedEvents,
            onEventClick: (ev) => openEventModal(ev)
        })

        calendarInitialized = true
    }

    async function loadAttendance() {
        const res = await fetch("/api/events/")
        const events = await res.json()
        const filtered = events.filter(e => e.classGroup === classgroup)
        const now = new Date()
        let counted = 0, attended = 0

        const container = document.getElementById("attendanceList")
        container.innerHTML = ""

        filtered.forEach(e => {
            const end = new Date(e.endTime)
            if (now > end) {
                counted++
                const attendedEvent = e.attendees.includes(email)
                if (attendedEvent) attended++

                const card = document.createElement("div")
                card.className = "attendance-card"

                const h4 = document.createElement("h4")
                h4.textContent = e.name

                const locP = document.createElement("p")
                locP.textContent = "📍 " + e.location

                const startP = document.createElement("p")
                startP.textContent = "Start: " + new Date(e.startTime).toLocaleString()

                const statusP = document.createElement("p")
                const statusB = document.createElement("b")
                statusB.className = attendedEvent ? "attended" : "missed"
                statusB.textContent = attendedEvent ? "✓ Attended" : "✗ Missed"
                statusP.appendChild(statusB)

                card.append(h4, locP, startP, statusP)
                container.appendChild(card)
            }
        })

        const missed = counted - attended
        const percent = counted === 0 ? 0 : Math.round((attended / counted) * 100)

        document.getElementById("attendancePercentage").textContent = percent + "%"
        document.getElementById("countedEvents").textContent = counted
        document.getElementById("attendedEvents").textContent = attended
        document.getElementById("missedEvents").textContent = missed
    }

    async function loadDashboard() {
        const res = await fetch("/api/events/")
        const events = await res.json()

        document.getElementById("studentEmail").textContent = email
        document.getElementById("studentClass").textContent = classgroup

        const filtered = events.filter(e => e.classGroup === classgroup)
        const now = new Date()
        let counted = 0, attended = 0
        const upcomingContainer = document.getElementById("upcomingEvents")
        upcomingContainer.innerHTML = ""
        let hasUpcoming = false

        filtered.forEach(e => {
            const start = new Date(e.startTime)
            const end = new Date(e.endTime)

            if (now > end) {
                counted++
                if (e.attendees.includes(email)) attended++
            }

            if (start > now) {
                hasUpcoming = true
                const item = document.createElement("p")
                item.className = "upcoming-item"
                item.textContent = `${e.name} • ${start.toLocaleDateString()}`
                upcomingContainer.appendChild(item)
            }
        })

        document.getElementById("noUpcoming").style.display = hasUpcoming ? "none" : "block"

        const percent = counted === 0 ? 0 : Math.round((attended / counted) * 100)
        document.getElementById("dashboardAttendance").textContent = percent + "%"
        document.getElementById("dashboardAttended").textContent = attended
    }

    async function checkIn(id) {
        const qrBtn = document.getElementById("qrBtn")
        if (qrBtn.textContent !== "Check In") return

        document.getElementById("checkinError").textContent = ""

        const eventData = await fetch("/api/events/" + id)
        const eventJson = await eventData.json()
        const code = eventJson.qrCode

        if (!code) {
            document.getElementById("checkinError").textContent = "No QR code has been generated for this event yet"
            return
        }

        const res = await fetch("/api/events/checkin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code, email })
        })

        const data = await res.json()

        if (data.success) {
            qrBtn.textContent = "✓ Checked In"
            qrBtn.className = "secondary-btn"
            qrBtn.onclick = null
        } else {
            document.getElementById("checkinError").textContent = data.error || "Check-in failed"
        }
    }

    function openCalendar() {
        document.getElementById("main").style.display = "none"
        document.getElementById("calendarDiv").style.display = "block"
        document.getElementById("attendanceDiv").style.display = "none"
        if (calendarInitialized) { calendar.render() }
    }

    function openAttendance() {
        document.getElementById("main").style.display = "none"
        document.getElementById("calendarDiv").style.display = "none"
        document.getElementById("attendanceDiv").style.display = "block"
        loadAttendance()
    }

    function openDashboard() {
        document.getElementById("main").style.display = "block"
        document.getElementById("calendarDiv").style.display = "none"
        document.getElementById("attendanceDiv").style.display = "none"
    }

    async function logout() {
        await fetch("/api/auth/logout", { method: "POST" })
        window.location.href = "/signin.html"
    }

    loadPage()
</script>
</body>
</html>
