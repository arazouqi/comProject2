<!DOCTYPE html>
<html>
  <head>
    <title>Teacher Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <div class="dashboard">
      <h1>Events Calendar</h1>
      <button onclick="openCreate()" class="primary-btn">Create Event</button>
      <div id="calendar"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Edit Event</h2>
            <input id="id" name="id" readonly><br>
            <input id="editName" name="name" required><br>
            <input id="editLocation" name="location" required><br>
            <input id="edit-start-time" type="datetime-local" name="start-time" required><br>
            <input id="edit-end-time" type="datetime-local" name="end-time" required><br>
            <input id="editClassgroup" type="string" name="classgroup" required><br>

            <button onclick="updateCalendarEvent()" class="primary-btn">Modify</button>
        </div>
    </div>

    <div id="modal-create" class="modal">
        <div class="modal-content">
            <h2>Create Event</h2>
            <input id="name" name="name" placeholder="Name" required><br>
            <input id="location" name="location" placeholder="Location" required><br>
            <input id="start-time" type="datetime-local" name="start-time" placeholder="Start Time" required><br>
            <input id="end-time" type="datetime-local" name="end-time" placeholder="End Time" required><br>
            <input id="classgroup" type="string" name="classgroup" placeholder="Class Group" required><br>
            <input id="teacher" type="string" name="teacher" placeholder="Teacher" required><br>

            <button onclick="createCalendarEvent()" class="primary-btn">Create</button>
        </div>
    </div>

    <div id="modal-qr" class="modal">
        <div class="modal-content">
            <h2>QR Code</h2>
            <img id="qrImage" />

            <button onclick="closeQrModal()" class="primary-btn">Close</button>
        </div>
    </div>

    <div id="eventModal" class="modal">
        <div class="modal-content event-modal">
            <h2 id="eventTitle"></h2>
            <p><strong>Location:</strong> <span id="eventLocation"></span></p>
            <p><strong>Class Group:</strong> <span id="eventClass"></span></p>
            <p><strong>Start:</strong> <span id="eventStart"></span></p>
            <p><strong>End:</strong> <span id="eventEnd"></span></p>

            <div class="modal-actions">
                <button id="modifyBtn" class="primary-btn">Modify</button>
                <button id="deleteBtn" class="danger-btn">Delete</button>
                <button id="qrBtn" class="secondary-btn">Generate QR</button>
                <button onclick="closeEventModal()" class="secondary-btn">Close</button>
            </div>
        </div>
    </div>

    <script>
        function toDatetimeLocal(date) {
            const d = new Date(date)
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset())
            return d.toISOString().slice(0,16)
        }

        let calendar
        let selectedEventId = null

        function openEventModal(event) {
            selectedEventId = event.id

            document.getElementById("eventTitle").innerText = event.title
            document.getElementById("eventLocation").innerText = event.extendedProps.location
            document.getElementById("eventClass").innerText = event.extendedProps.classGroup
            document.getElementById("eventStart").innerText = new Date(event.start).toLocaleString()
            document.getElementById("eventEnd").innerText = new Date(event.end).toLocaleString()

            document.getElementById("modifyBtn").onclick = () => openModify(selectedEventId)
            document.getElementById("deleteBtn").onclick = () => deleteEventConfirm()
            document.getElementById("qrBtn").onclick = () => qr(selectedEventId)

            document.getElementById("eventModal").style.display = "flex"
        }

        function closeEventModal() {
            document.getElementById("eventModal").style.display = "none"
        }

        async function loadEvents() {
            const res = await fetch("/api/events/")
            const events = await res.json()

            const formattedEvents = events.map(e => ({
                id: e.id,
                title: e.name,
                start: e.startTime,
                end: e.endTime,
                extendedProps: {
                    location: e.location,
                    classGroup: e.classGroup
                }
            }))

            const calendarEl = document.getElementById("calendar")
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: "dayGridMonth",
                headerToolbar: {
                    left: "prev,next today",
                    center: "title",
                    right: "dayGridMonth,timeGridWeek,timeGridDay"
                },
                events: formattedEvents,
                eventClick: function(info) {
                    openEventModal(info.event)
                },
            })

            calendar.render()
        }
        
        async function deleteEventConfirm() {
            const btn = document.getElementById("deleteBtn")

            if (btn.innerText === "Confirm") {
                await fetch("/api/events/" + selectedEventId, {
                    method: "DELETE"
                })

                closeEventModal()
                window.location.reload()
            } else {
                btn.innerText = "Confirm"
            }
        }

        async function qr(id) {
            const res = await fetch("/api/events/" + id + "/qr", {
                method: "POST"
            })

            const data = await res.json()
            const qrImage = document.getElementById("qrImage")

            qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${data.code}`

            document.getElementById("eventModal").style.display = "none"
            document.getElementById("modal-qr").style.display = "flex"
        }

        function closeQrModal() {
            document.getElementById("modal-qr").style.display = "none"
            document.getElementById("eventModal").style.display = "flex"
        }

        function openCreate() {
            document.getElementById("modal-create").style.display = "flex"
        }

        async function openModify(id) {
            const res = await fetch("/api/events/" + id, {
                method: "GET"
            })

            const event = await res.json()

            document.getElementById("id").value = id
            document.getElementById("editName").value = event.name
            document.getElementById("editLocation").value = event.location
            document.getElementById("edit-start-time").value = toDatetimeLocal(event.startTime)
            document.getElementById("edit-end-time").value = toDatetimeLocal(event.endTime)
            document.getElementById("editClassgroup").value = event.classGroup

            document.getElementById("eventModal").style.display = "none"
            document.getElementById("modal").style.display = "flex"
        }

        async function createCalendarEvent() {
            const name = document.getElementById("name").value
            const location = document.getElementById("location").value
            const startTime = document.getElementById("start-time").value
            const endTime = document.getElementById("end-time").value
            const classGroup = document.getElementById("classgroup").value
            const teacher = document.getElementById("teacher").value

            await fetch("/api/events/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, location, startTime, endTime, classGroup, teacher })
            })

            document.getElementById("modal-create").style.display = "none"

            calendar.refetchEvents()
            window.location.reload()
        }

        async function updateCalendarEvent() {
            const id = document.getElementById("id").value
            const name = document.getElementById("editName").value
            const location = document.getElementById("editLocation").value
            const startTime = document.getElementById("edit-start-time").value
            const endTime = document.getElementById("edit-end-time").value
            const classGroup = document.getElementById("editClassgroup").value

            await fetch("/api/events/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, location, startTime, endTime, classGroup })
            })

            document.getElementById("modal").style.display = "none"
            document.getElementById("eventModal").style.display = "flex"

            calendar.refetchEvents()
            window.location.reload()
        }

        loadEvents()
    </script>
  </body>
</html>
