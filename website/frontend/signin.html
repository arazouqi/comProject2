<!DOCTYPE html>
<html>
  <head>
    <title>ClassIn — Sign In</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body class="login-body">
    <div class="login-card">
      <div class="login-logo">ClassIn</div>
      <p class="login-subtitle">Attendance management system</p>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="login">Username or Email</label>
          <input id="login" type="text" name="username" autocomplete="username" placeholder="Enter your username or email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" name="current-password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>

        <button class="primary-btn" type="submit">Sign In</button>
      </form>

      <p id="login-error" class="error-msg"></p>
    </div>

    <script>
      const loginForm = document.getElementById("login-form");
      const errorText = document.getElementById("login-error");

      async function signIn() {
        const login = document.getElementById("login").value.trim();
        const password = document.getElementById("password").value.trim();

        errorText.textContent = "";

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: login, login, password })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            errorText.textContent = data.error || "Login failed";
            return;
          }

          window.location.href = `/${data.user.role}dashboard`;
        } catch (err) {
          errorText.textContent = "Could not connect to server";
        }
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        signIn();
      });
    </script>
  </body>
</html>
