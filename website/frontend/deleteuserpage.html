<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h2>Delete User</h2>

        <p id="message"></p>

        <form method="POST" action="/deleteuser">
            <input name="email" placeholder="User email">
            <button type="submit">Delete</button>
        </form>

        <a href="/admindashboard">Back</a>

        <script>
            const params = new URLSearchParams(window.location.search)
            const messageText = params.get("message")
            const status = params.get("status")

            if (status === "success") { message.style.color = "green" }
            if (status === "error") { message.style.color = "red" }

            if (messageText) {
                document.getElementById("message").textContent = messageText
            }
        </script>
    </body>
</html>
