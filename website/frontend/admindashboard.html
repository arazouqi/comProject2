<!DOCTYPE html>
<html>
    <head>
        <title>Admin Dashboard</title>

        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="dashboard">
            <h1>Admin Panel</h1>

            <div class="controls">
                <input id="search" placeholder="Search by name">
                <p id="notification"></p>
                <button class="primary-btn" onclick="openCreateModal()">Create User</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users"></tbody>
            </table>

            <div class="pagination">
                <button onclick="prevPage()">Prev</button>
                <span id="page"></span>
                <button onclick="nextPage()">Next</button>
            </div>
        </div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <h2>Edit User</h2>

                <input id="id" readonly><br>

                <input id="editUsername" placeholder="Username"><br>
                <input id="editName" placeholder="Name"><br>
                <input id="editEmail" placeholder="Email"><br>
                <input id="editPassword" type="password" placeholder="New Password"><br>

                <select id="editRole">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select><br>

                <select id="editClassGroup">
                    <option value="none">None</option>

                    <option value="computer-science-year-1">CS Year 1</option>
                    <option value="computer-science-year-2">CS Year 2</option>
                    <option value="computer-science-year-3">CS Year 3</option>

                    <option value="mathematics-year-1">Maths Year 1</option>
                    <option value="mathematics-year-2">Maths Year 2</option>
                    <option value="mathematics-year-3">Maths Year 3</option>

                    <option value="psychology-year-1">Psychology Year 1</option>
                    <option value="psychology-year-2">Psychology Year 2</option>
                    <option value="psychology-year-3">Psychology Year 3</option>

                    <option value="business-year-1">Business Year 1</option>
                    <option value="business-year-2">Business Year 2</option>
                    <option value="business-year-3">Business Year 3</option>

                    <option value="music-studies-year-1">Music Year 1</option>
                    <option value="music-studies-year-2">Music Year 2</option>
                    <option value="music-studies-year-3">Music Year 3</option>
                </select><br>

                <button onclick="saveUser()" class="primary-btn">Save</button>
                <button onclick="closeModal()" class="danger-btn">Close</button>
            </div>
        </div>

        <div id="modal-create" class="modal">
            <div class="modal-content">
                <h2>Create User</h2>

                <input id="username" placeholder="Username" required><br>
                <input id="name" placeholder="Name" required><br>
                <input id="email" placeholder="Email" required><br>
                <input id="password" type="password" placeholder="Password" required><br>

                <select id="role" required>
                    <option value="">Select role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select><br>

                <select id="classGroup" required>
                    <option value="none">None</option>

                    <option value="computer-science-year-1">CS Year 1</option>
                    <option value="computer-science-year-2">CS Year 2</option>
                    <option value="computer-science-year-3">CS Year 3</option>

                    <option value="mathematics-year-1">Maths Year 1</option>
                    <option value="mathematics-year-2">Maths Year 2</option>
                    <option value="mathematics-year-3">Maths Year 3</option>

                    <option value="psychology-year-1">Psychology Year 1</option>
                    <option value="psychology-year-2">Psychology Year 2</option>
                    <option value="psychology-year-3">Psychology Year 3</option>

                    <option value="business-year-1">Business Year 1</option>
                    <option value="business-year-2">Business Year 2</option>
                    <option value="business-year-3">Business Year 3</option>

                    <option value="music-studies-year-1">Music Year 1</option>
                    <option value="music-studies-year-2">Music Year 2</option>
                    <option value="music-studies-year-3">Music Year 3</option>
                </select><br><br>

                <button onclick="createUser()" class="primary-btn">Create</button>
                <button onclick="closeCreateModal()" class="danger-btn">Close</button>
            </div>
        </div>

        <div id="calendarModal" class="modal">
            <div class="modal-content attendance-modal">
                <h2>User Events</h2>
                <div id="adminEventList" class="attendance-list"></div>
                <div class="pagination">
                    <button onclick="prevEventPage()">Prev</button>
                    <span id="eventPage"></span>
                    <button onclick="nextEventPage()">Next</button>
                </div>
                <button onclick="closeCalendar()" class="danger-btn">Close</button>
            </div>
        </div>

        <div id="attendanceModal" class="modal">
            <div class="modal-content attendance-modal">
                <h2>User Attendance</h2>
                <div class="attendance-summary">
                    <p><strong>Attendance:</strong> <span id="adminAttendancePercent"></span></p>
                    <p>Attended: <span id="adminAttended"></span></p>
                    <p>Missed: <span id="adminMissed"></span></p>
                </div>
                <div id="adminAttendanceList" class="attendance-list"></div>

                <div class="pagination">
                    <button onclick="prevAttendancePage()">Prev</button>
                    <span id="attendancePage"></span>
                    <button onclick="nextAttendancePage()">Next</button>
                </div>

                <button onclick="closeAttendance()" class="danger-btn">Close</button>
            </div>
        </div>

        <script>
            let allUsers = []
            let filteredUsers = []
            let page = 0
            const pageSize = 10
            
            let eventList = []
            let eventPage = 0
            const eventPageSize = 5

            let attendanceList = []
            let attendancePage = 0
            const attendancePageSize = 5

            async function viewCalendar(email, classGroup) {
                const res = await fetch("/api/events/")
                const events = await res.json()

                eventList = events.filter(e => e.classGroup === classGroup)
                eventPage = 0
                renderEvents()
                document.getElementById("calendarModal").style.display = "flex"
            }

            function closeCalendar() {
                document.getElementById("calendarModal").style.display = "none"
            }

            function renderEvents() {
                const list = document.getElementById("adminEventList")
                list.innerHTML = ""

                if (eventList.length === 0) {
                    list.innerHTML = "<p>No events found for this class.</p>"
                    return
                }

                const start = eventPage * eventPageSize
                const pageData = eventList.slice(start, start + eventPageSize)

                pageData.forEach(e => {
                    const card = document.createElement("div")
                    card.className = "admin-attendance-card"
                    card.innerHTML = `
                        <h4>${e.name}</h4>
                        <p>Location: ${e.location}</p>
                        <p>Start: ${new Date(e.startTime).toLocaleString()}</p>
                        <p>End: ${new Date(e.endTime).toLocaleString()}</p>
                    `
                    list.appendChild(card)
                })

                const totalPages = Math.ceil(eventList.length / eventPageSize)
                document.getElementById("eventPage").innerText =
                    `Page ${eventPage+1} / ${Math.max(totalPages,1)}`
            }

            function nextEventPage() {
                const maxPage = Math.ceil(eventList.length / eventPageSize) - 1

                if (eventPage < maxPage) {
                    eventPage++
                    renderEvents()
                }
            }

            function prevEventPage() {
                if (eventPage > 0) {
                    eventPage--
                    renderEvents()
                }
            }

            async function loadUsers() {
                const res = await fetch("/api/users/")
                allUsers = await res.json()
                filteredUsers = allUsers
                page = 0

                render()
            }

            function render() {
                const body=document.getElementById("users")
                body.innerHTML=""

                const start = page * pageSize
                const data = filteredUsers.slice(start, start+pageSize)

                data.forEach((u) => {
                    if (u.role === "student") {
                        const row = document.createElement("tr")
                        row.innerHTML = `
                            <td>${u.name}</td>
                            <td>${u.email}</td>
                            <td>${u.role}</td>

                            <td>
                                <button onclick="openModal('${u.id}')">Modify</button>
                                <button onclick="confirmDelete(this,'${u.id}')">Delete</button>
                                <button onclick="viewCalendar('${u.email}','${u.classGroup}')">Calendar</button>
                                <button onclick="viewAttendance('${u.email}','${u.classGroup}')">Attendance</button>
                            </td>
                        `

                        body.appendChild(row)
                    } else {
                        const row = document.createElement("tr")
                        row.innerHTML = `
                            <td>${u.name}</td>
                            <td>${u.email}</td>
                            <td>${u.role}</td>

                            <td>
                                <button onclick="openModal('${u.id}')">Modify</button>
                                <button onclick="confirmDelete(this,'${u.id}')">Delete</button>
                            </td>
                        `

                        body.appendChild(row)
                    }
                })

                const totalPages = Math.ceil(filteredUsers.length / pageSize)

                document.getElementById("page").innerText=`Page ${page+1} / ${Math.max(totalPages, 1)}`
            }

            function nextPage() {
                const maxPage = Math.ceil(filteredUsers.length / pageSize) - 1

                if (page < maxPage) {
                    page++
                    render()
                }
            }

            function prevPage() {
                if (page > 0) {
                    page--
                    render()
                }
            }

            async function viewAttendance(email, classGroup) {
                const res = await fetch("/api/events/")
                const events = await res.json()
                const filtered = events.filter(e => e.classGroup === classGroup)
                const now = new Date()

                attendanceList = []
                let attended = 0

                filtered.forEach(e => {
                    const end = new Date(e.endTime)
                    if (now > end) {
                        const didAttend = e.attendees.includes(email)
                        if (didAttend) attended++

                        attendanceList.push({
                            name: e.name,
                            start: e.startTime,
                            attended: didAttend
                        })
                    }
                })

                attendancePage = 0
                renderAttendance()

                const missed = attendanceList.length - attended
                const percent = attendanceList.length === 0 ? 0 :
                    Math.round((attended / attendanceList.length) * 100)

                document.getElementById("adminAttendancePercent").innerText = percent + "%"
                document.getElementById("adminAttended").innerText = attended
                document.getElementById("adminMissed").innerText = missed
                document.getElementById("attendanceModal").style.display = "flex"
            }

            function renderAttendance() {
                const list = document.getElementById("adminAttendanceList")
                list.innerHTML = ""

                if (attendanceList.length === 0) {
                    list.innerHTML = "<p>No attendance data available.</p>"
                    return
                }

                const start = attendancePage * attendancePageSize
                const data = attendanceList.slice(start, start + attendancePageSize)

                data.forEach(e => {
                    const card = document.createElement("div")
                    card.className = "admin-attendance-card"
                    card.innerHTML = `
                        <h4>${e.name}</h4>
                        <p>${new Date(e.start).toLocaleString()}</p>
                        <p class="${e.attended ? "attended" : "missed"}">
                            ${e.attended ? "Attended" : "Missed"}
                        </p>
                    `

                    list.appendChild(card)
                })
            }

            function closeAttendance() {
                document.getElementById("attendanceModal").style.display = "none"
            }

            function nextAttendancePage() {
                const maxPage = Math.ceil(attendanceList.length / attendancePageSize) - 1

                if (attendancePage < maxPage) {
                    attendancePage++
                    renderAttendance()
                }
            }

            function prevAttendancePage() {
                if (attendancePage > 0) {
                    attendancePage--
                    renderAttendance()
                }
            }

            document.getElementById("search").oninput = e => {
                const q = e.target.value.toLowerCase()

                filteredUsers = allUsers.filter(u =>
                    u.name.toLowerCase().includes(q)
                )

                page = 0
                render()
            }

            async function confirmDelete(btn, id) {
                if (btn.innerText === "Confirm") {
                    await fetch("/api/users/" + id, { 
                        method: "DELETE"
                    })

                    loadUsers()
                } else {
                    btn.innerText = "Confirm"
                }
            }

            async function openModal(id) {
                const res = await fetch("/api/users/" + id)
                const user = await res.json()

                document.getElementById("id").value = id
                document.getElementById("editUsername").value = user.username
                document.getElementById("editName").value = user.name
                document.getElementById("editEmail").value = user.email
                document.getElementById("editRole").value = user.role
                document.getElementById("editClassGroup").value = user.classGroup

                document.getElementById("modal").style.display = "flex"
            }

            function openCreateModal() {
                document.getElementById("modal-create").style.display = "flex"
            }

            function closeModal() {
                document.getElementById("modal").style.display = "none"
            }

            function closeCreateModal() {
                document.getElementById("modal-create").style.display = "none"
            }

            async function saveUser() {
                const id = document.getElementById("id").value
                const username = document.getElementById("editUsername").value
                const name = document.getElementById("editName").value
                const email = document.getElementById("editEmail").value
                const password = document.getElementById("editPassword").value
                const role = document.getElementById("editRole").value
                const classGroup = document.getElementById("editClassGroup").value

                const res = await fetch("/api/users/" + id, {
                    method: "PUT",
                    headers: { "Content-Type":"application/json" },
                    body: JSON.stringify({
                        username,
                        name,
                        email,
                        password,
                        role,
                        classGroup
                    })
                })

                if (res.status == 200) {
                    document.getElementById("notification").innerText = "User successfully updated"
                    document.getElementById("modal").style.display="none"

                    loadUsers()
                } else {
                    document.getElementById("notification").innerText = `Error ${res.status}: ${res.statusText}`
                }

                await new Promise(r => setTimeout(r, 2000));
                document.getElementById("notification").innerText = ""
            }

            async function createUser() {
                const username = document.getElementById("username").value
                const name = document.getElementById("name").value
                const email = document.getElementById("email").value
                const password = document.getElementById("password").value
                const role = document.getElementById("role").value
                const classGroup = document.getElementById("classGroup").value

                await fetch("/api/users/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username,
                        name,
                        email,
                        password,
                        role,
                        classGroup
                    })
                })

                document.getElementById("modal-create").style.display = "none"

                loadUsers()
            }

            loadUsers()
        </script>
    </body>
</html>
